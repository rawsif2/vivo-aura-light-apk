
name: Build Aura Control APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter project
        run: |
          flutter create --platforms=android --org com.tawsif aura_app

          cat > aura_app/pubspec.yaml <<'EOF'
          name: aura_control
          description: Manual Vivo iQOO Aura Light controller.
          publish_to: none
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            monster_halo: ^0.1.0

          flutter:
            uses-material-design: true
          EOF

          cat > aura_app/lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:monster_halo/monster_halo.dart';

          void main() => runApp(const AuraApp());

          class AuraApp extends StatelessWidget {
            const AuraApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Aura Control',
                theme: ThemeData.dark(useMaterial3: true),
                home: const AuraHome(),
              );
            }
          }

          class AuraHome extends StatefulWidget {
            const AuraHome({super.key});

            @override
            State<AuraHome> createState() => _AuraHomeState();
          }

          class _AuraHomeState extends State<AuraHome> {
            final halo = MonsterHalo.instance;

            Color color = Colors.cyan;
            HaloStyle style = HaloStyle.solid;
            double brightness = 100;
            String status = 'Checking device...';
            bool detected = false;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              checkDevice();
            }

            Future<void> checkDevice() async {
              try {
                final result = await halo.hasLight();
                final type = await halo.getLightType();
                final lightCase = await halo.getLightCase();

                if (!mounted) return;

                setState(() {
                  detected = result;
                  status = 'Light detected: $result\n'
                      'Type: $type\nCase: $lightCase';
                });
              } catch (e) {
                if (!mounted) return;
                setState(() => status = 'Detection error: $e');
              }
            }

            Future<void> turnOn() async {
              setState(() => busy = true);

              try {
                final effect = HaloEffectBuilder()
                    .style(style)
                    .color(HaloColor.fromColor(color))
                    .brightness(brightness.toInt())
                    .periodMs(1000)
                    .count(60)
                    .stopByCount(true)
                    .build();

                await halo.play(effect);

                if (mounted) {
                  setState(() => status = 'Light command sent');
                }
              } catch (e) {
                if (mounted) {
                  setState(() => status = 'Error: $e');
                }
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            Future<void> turnOff() async {
              try {
                await halo.stopAll();
                if (mounted) {
                  setState(() => status = 'Stop command sent');
                }
              } catch (e) {
                if (mounted) setState(() => status = 'Error: $e');
              }
            }

            @override
            Widget build(BuildContext context) {
              final colors = [
                Colors.red,
                Colors.orange,
                Colors.yellow,
                Colors.green,
                Colors.cyan,
                Colors.blue,
                Colors.purple,
                Colors.pink,
                Colors.white,
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Aura Control'),
                  centerTitle: true,
                  actions: [
                    IconButton(
                      onPressed: checkDevice,
                      icon: const Icon(Icons.refresh),
                    ),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const SizedBox(height: 20),
                    const Icon(
                      Icons.light_mode,
                      size: 75,
                      color: Colors.cyan,
                    ),
                    const SizedBox(height: 12),
                    const Center(
                      child: Text(
                        'AURA CONTROL',
                        style: TextStyle(
                          fontSize: 24,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                    const SizedBox(height: 8),
                    Center(
                      child: Text(
                        detected ? 'Device detected' : 'Checking compatibility',
                        style: TextStyle(
                          color: detected ? Colors.green : Colors.orange,
                        ),
                      ),
                    ),
                    const SizedBox(height: 30),
                    FilledButton.icon(
                      onPressed: busy ? null : turnOn,
                      icon: const Icon(Icons.power_settings_new),
                      label: const Text('TURN ON'),
                      style: FilledButton.styleFrom(
                        minimumSize: const Size.fromHeight(58),
                        backgroundColor: Colors.teal,
                      ),
                    ),
                    const SizedBox(height: 12),
                    OutlinedButton.icon(
                      onPressed: turnOff,
                      icon: const Icon(Icons.power_off),
                      label: const Text('TURN OFF'),
                      style: OutlinedButton.styleFrom(
                        minimumSize: const Size.fromHeight(55),
                      ),
                    ),
                    const SizedBox(height: 28),
                    const Text(
                      'Choose colour',
                      style: TextStyle(fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 15),
                    Wrap(
                      spacing: 14,
                      runSpacing: 14,
                      children: colors.map((c) {
                        return GestureDetector(
                          onTap: () => setState(() => color = c),
                          child: Container(
                            width: 42,
                            height: 42,
                            decoration: BoxDecoration(
                              color: c,
                              shape: BoxShape.circle,
                              border: Border.all(
                                color: color == c
                                    ? Colors.white
                                    : Colors.transparent,
                                width: 3,
                              ),
                            ),
                          ),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 28),
                    const Text(
                      'Brightness',
                      style: TextStyle(fontWeight: FontWeight.bold),
                    ),
                    Slider(
                      value: brightness,
                      min: 1,
                      max: 100,
                      divisions: 99,
                      label: '${brightness.toInt()}%',
                      onChanged: (v) => setState(() => brightness = v),
                    ),
                    const SizedBox(height: 15),
                    const Text(
                      'Lighting effect',
                      style: TextStyle(fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 12),
                    Wrap(
                      spacing: 8,
                      runSpacing: 8,
                      children: [
                        HaloStyle.solid,
                        HaloStyle.slowPulse,
                        HaloStyle.strobe,
                        HaloStyle.chase,
                        HaloStyle.comet,
                      ].map((s) {
                        return ChoiceChip(
                          label: Text(s.name),
                          selected: style == s,
                          onSelected: (_) => setState(() => style = s),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 25),
                    const Text(
                      'Device information',
                      style: TextStyle(fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 10),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(15),
                        child: SelectableText(status),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Center(
                      child: Text(
                        'Made for Vivo / iQOO',
                        style: TextStyle(color: Colors.white54),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        working-directory: aura_app
        run: flutter pub get

      - name: Build APK
        working-directory: aura_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Control-APK
          path: aura_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
